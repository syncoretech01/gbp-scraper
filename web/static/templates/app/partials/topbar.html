{{define "app/topbar"}}
<header class="app-topbar">
    <button class="icon-button mobile-menu" type="button" data-action="toggle-sidebar" aria-controls="app-sidebar" aria-expanded="false">
        <span aria-hidden="true">☰</span><span class="sr-only">Open navigation</span>
    </button>

    <form class="global-search" action="/app/results" method="get" role="search" data-action="global-search" data-endpoint="/api/v1/search">
        <label class="sr-only" for="global-search">Search normalized businesses</label>
        <span aria-hidden="true">⌕</span>
        <input id="global-search" name="q" type="search" autocomplete="off" placeholder="Search businesses" aria-controls="global-search-results" aria-expanded="false">
        <kbd>/</kbd>
        <div class="search-popover" id="global-search-results" data-search-results hidden></div>
    </form>

    <div class="topbar-actions">
        {{if .AuthEnabled}}<form method="post" action="/logout" class="inline-form"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><button class="button button-small" type="submit">Sign out</button></form>{{end}}
        <a class="activity-pill" href="/app/jobs?state=running,queued" data-action="navigate" data-endpoint="/app/jobs?state=running,queued" aria-label="Open active jobs">
            <span class="activity-dot" aria-hidden="true"></span>
            <span data-activity-label>{{if .Activity.Running}}{{.Activity.Running}} running{{else}}No active jobs{{end}}</span>
            {{if .Activity.Queued}}<span class="badge">{{.Activity.Queued}} queued</span>{{end}}
        </a>
        <button class="icon-button" type="button" data-action="open-command-palette" aria-haspopup="dialog" aria-controls="command-palette"><span aria-hidden="true">⌘</span><span class="sr-only">Open command palette</span></button>
        <button class="icon-button" type="button" data-action="cycle-theme" aria-label="Change appearance"><span data-theme-icon aria-hidden="true">◐</span></button>
    </div>
</header>
{{end}}
